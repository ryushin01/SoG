name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Actions 화면에서 main을 다시 배포할 때
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Storybook · Build · E2E
    runs-on: ubuntu-latest
    # 어느 단계가 멈춰도 40분 안에 끝냅니다(기본값은 6시간).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # pnpm 버전은 package.json의 packageManager를 따름
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # ESLint(angular-eslint, 템플릿 접근성 규칙) + FSD 규칙(Steiger)
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # 데모 서버(동시성 규칙), 도메인 규칙, 컴포넌트 테스트
      - run: pnpm test
      # Playwright 브라우저는 버전별로 캐시하고, 설치가 멈추면 6분 뒤 끊고 최대 3번 다시 시도합니다.
      - name: Playwright 버전 확인
        id: playwright
        run: echo "version=$(pnpm --filter @sog/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Playwright Chromium 설치
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            timeout 360 pnpm --filter @sog/e2e exec playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright 설치 ${attempt}번째 시도 실패, 다시 시도합니다."
          done
          exit 1
      # 모든 스토리를 실제 브라우저(Chromium)에서 렌더링하고 axe 접근성 검사
      - run: pnpm test:storybook
        timeout-minutes: 10
      - run: pnpm build
      # 프로덕션 빌드를 배포 구조(/, /count/)로 합쳐 업무 흐름·접근성·화면 넘침·서비스 워커 검사
      - run: pnpm e2e
      # 배포 구조(site/)로 합쳐 번들 크기와 Lighthouse 점수를 잽니다.
      - run: pnpm site
      - run: pnpm size
      - run: pnpm lhci
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          # .lighthouseci는 숨김 폴더라 따로 켜야 올라갑니다.
          include-hidden-files: true
          path: |
            e2e/playwright-report/
            e2e/test-results/
            .lighthouseci/
          retention-days: 7

  # main에 머지하면 Cloudflare Workers에 배포합니다(docs/ci-deploy.md).
  deploy:
    name: Cloudflare Workers 배포
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 배포는 하나씩 하고, 진행 중인 배포를 취소하지 않습니다.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # 직전 푸시와 비교해 화면·서버에 영향이 없는 변경(문서·E2E·테스트·스토리·CI 설정)만 있으면 건너뜁니다.
      - name: 배포할 변경 확인
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          deploy=true
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" HEAD)
            if ! echo "$changed" | grep -qvE '(^docs/|\.md$|^e2e/|\.spec\.ts$|\.test\.ts$|\.stories\.ts$|^\.github/|^\.husky/|^\.vscode/|^\.prettier|^\.editorconfig$)'; then
              deploy=false
              echo "::notice::화면·서버에 영향이 없는 변경이라 배포를 건너뜁니다."
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
        if: steps.changes.outputs.deploy == 'true'
      - uses: actions/setup-node@v5
        if: steps.changes.outputs.deploy == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.changes.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.deploy == 'true'
        run: pnpm turbo run build build-storybook --filter=@sog/backoffice --filter=@sog/count
      - if: steps.changes.outputs.deploy == 'true'
        run: node scripts/build-cloudflare.mjs
      - name: Cloudflare Workers에 배포
        if: steps.changes.outputs.deploy == 'true'
        run: npx --yes wrangler@4.156.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
