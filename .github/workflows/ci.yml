name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Test · Storybook · Build · E2E
    runs-on: ubuntu-latest
    # 어느 단계가 멈춰도 40분 안에 끝냅니다(기본값은 6시간).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # pnpm 버전은 package.json의 packageManager를 따름
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # ESLint(angular-eslint, 템플릿 접근성 규칙) + FSD 규칙(Steiger)
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # 데모 서버(동시성 규칙), 도메인 규칙, 컴포넌트 테스트
      - run: pnpm test
      # Playwright 브라우저는 버전별로 캐시하고, 설치가 멈추면 6분 뒤 끊고 최대 3번 다시 시도합니다.
      - name: Playwright 버전 확인
        id: playwright
        run: echo "version=$(pnpm --filter @sog/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Playwright Chromium 설치
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            timeout 360 pnpm --filter @sog/e2e exec playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright 설치 ${attempt}번째 시도 실패, 다시 시도합니다."
          done
          exit 1
      # 모든 스토리를 실제 브라우저(Chromium)에서 렌더링하고 axe 접근성 검사
      - run: pnpm test:storybook
        timeout-minutes: 10
      - run: pnpm build
      # 프로덕션 빌드를 배포 구조(/, /count/)로 합쳐 업무 흐름·접근성·화면 넘침·서비스 워커 검사
      - run: pnpm e2e
      # 배포 구조(site/)로 합쳐 번들 크기와 Lighthouse 점수를 잽니다.
      - run: pnpm site
      - run: pnpm size
      - run: pnpm lhci
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          # .lighthouseci는 숨김 폴더라 따로 켜야 올라갑니다.
          include-hidden-files: true
          path: |
            e2e/playwright-report/
            e2e/test-results/
            .lighthouseci/
          retention-days: 7
