# 의존성 자동 업데이트 (Dependabot)
# - 메이저 버전은 유지하고, 같은 메이저 안의 패치·마이너만 주 1회 PR로 받습니다.
# - 출시 후 14일이 지난 버전만 제안합니다. (갓 나온 버전의 문제를 피함)
# - PR마다 CI(lint·타입 검사·테스트·스토리 테스트·빌드·E2E)가 실행되므로, 통과한 PR만 합칩니다.
version: 2
updates:
  - package-ecosystem: npm # pnpm(pnpm-lock.yaml)도 npm 생태계로 처리
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      # 메이저 업그레이드는 받지 않음 (필요할 때 직접 계획해서 진행)
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'angular-eslint']
      storybook:
        patterns: ['storybook', '@storybook/*', 'eslint-plugin-storybook']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
